services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-recruiter-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://DB_USER_NAME:DB_PASSWORD@host.docker.internal:5432/ai_recruiter
      - CORS_ORIGIN=https://recruter.ai-nvkz.ru
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - backend_audio:/app/audio
    networks:
      - ai-recruiter-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-recruiter-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ai-recruiter-net

volumes:
  backend_audio:
    driver: local

networks:
  ai-recruiter-net:
    driver: bridge